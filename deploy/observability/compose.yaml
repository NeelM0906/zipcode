name: qwen38-observability

services:
  gpu-exporter:
    image: lmsysorg/sglang@sha256:616a3e97f45191af975896cfa644279096cb31bd408a071c2e99ca7209c3cafe
    container_name: qwen38-gpu-exporter
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./gpu_exporter.py:/exporter/gpu_exporter.py:ro
    entrypoint: ["python3", "/exporter/gpu_exporter.py"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9835/health\", timeout=5).read()'"]
      interval: 15s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: qwen38-prometheus
    restart: unless-stopped
    network_mode: host
    depends_on:
      gpu-exporter:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=5GB
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:13.1.0
    container_name: qwen38-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  prometheus-data:
  grafana-data:
