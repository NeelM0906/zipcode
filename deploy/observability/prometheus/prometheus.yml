global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    deployment: qwen38-dual-rtxpro

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qwen-worker
    scrape_timeout: 4s
    static_configs:
      - targets: [127.0.0.1:8010]
        labels:
          replica: gpu0
      - targets: [127.0.0.1:8020]
        labels:
          replica: gpu1-flash-next

  - job_name: qwen-codex-gateway
    scrape_timeout: 4s
    static_configs:
      - targets: [127.0.0.1:8012]
        labels:
          model: qwen38-27b
      - targets: [127.0.0.1:8022]
        labels:
          model: qwen38-flash-next

  - job_name: qwen-router
    scrape_timeout: 4s
    static_configs:
      - targets: [127.0.0.1:29000]

  - job_name: qwen-gpu
    scrape_timeout: 4s
    static_configs:
      - targets: [127.0.0.1:9835]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
