name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
      - name: Require GitHub OAuth client ID
        shell: bash
        env:
          ZIPCODE_GITHUB_CLIENT_ID: ${{ vars.ZIPCODE_GITHUB_CLIENT_ID }}
        run: test -n "$ZIPCODE_GITHUB_CLIENT_ID"
      - name: Configure verified Rusty V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build ZIPCODE
        env:
          ZIPCODE_GITHUB_CLIENT_ID: ${{ vars.ZIPCODE_GITHUB_CLIENT_ID }}
        run: >-
          cargo build --release --locked
          -p codex-cli --bin codex
          -p codex-zipcode-cli --bin zip-code
          -p codex-code-mode-host --bin codex-code-mode-host
      - name: Strip Unix release binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: strip target/release/zip-code target/release/codex target/release/codex-code-mode-host
      - name: Package Unix build
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="zipcode-${{ matrix.target }}"
          mkdir -p "../dist/$package"
          cp target/release/zip-code "../dist/$package/zip-code"
          cp target/release/codex "../dist/$package/zip-code-core"
          cp target/release/codex-code-mode-host "../dist/$package/codex-code-mode-host"
          cp ../LICENSE ../NOTICE "../dist/$package/"
          tar -C ../dist -czf "../dist/$package.tar.gz" "$package"
      - name: Package Windows build
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "zipcode-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "../dist/$package" | Out-Null
          Copy-Item target/release/zip-code.exe "../dist/$package/zip-code.exe"
          Copy-Item target/release/codex.exe "../dist/$package/zip-code-core.exe"
          Copy-Item target/release/codex-code-mode-host.exe "../dist/$package/codex-code-mode-host.exe"
          Copy-Item ../LICENSE,../NOTICE "../dist/$package/"
          Compress-Archive -Path "../dist/$package" -DestinationPath "../dist/$package.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zipcode-${{ matrix.target }}
          path: dist/zipcode-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum zipcode-* > SHA256SUMS
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --title "ZIPCODE ${GITHUB_REF_NAME}"
          --generate-notes
