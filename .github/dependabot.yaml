version: 2

updates:
  - package-ecosystem: cargo
    directory: /codex-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
