name: Bug report
description: Report a reproducible ZIPCODE problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ZIPCODE version
      description: Paste the output of `zip-code --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture, and terminal.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Redact prompts, source code, tokens, and private URLs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
